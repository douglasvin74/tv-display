<!doctype html><meta charset="utf-8"><title>TV</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{border:0;width:100%;height:100%}
#f{position:fixed;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
#y{display:none;position:fixed;right:8px;bottom:8px;width:240px;height:135px;border-radius:6px;z-index:5}
#msg{position:fixed;left:0;right:0;bottom:8%;text-align:center;font:bold 5vw system-ui;color:#fff;text-shadow:0 0 12px #000;display:none}
</style>
<iframe id="f" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe><iframe id="y" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><audio id="a"></audio><audio id="v"></audio><div id="msg"></div>
<script>
const f=document.getElementById('f'),m=document.getElementById('msg'),a=document.getElementById('a'),y=document.getElementById('y'),v=document.getElementById('v');let t,cur=null;
/* a TV reporta viewport pequeno (ex.: 960x540): renderiza a página em 1440x810 e reduz para caber */
function fit(){f.style.transform='scale('+innerWidth/1440+','+innerHeight/810+')'}
addEventListener('resize',fit);fit();
const yc=(func,args=[])=>y.contentWindow&&y.contentWindow.postMessage(JSON.stringify({event:'command',func,args}),'*');
const YC={pause:'pauseVideo',play:'playVideo',next:'nextVideo',prev:'previousVideo'};
a.onended=()=>fetch('/api/musicEnded');
new EventSource('/api/events').onmessage=e=>{
  const d=JSON.parse(e.data);
  if(d.cmd==='load'){if(d.restore&&cur===d.url)return;cur=d.url;f.src=d.url||'about:blank'}
  else if(d.cmd==='msg'){m.textContent=d.text;m.style.display='block';clearTimeout(t);t=setTimeout(()=>m.style.display='none',10000)}
  else if(d.cmd==='yt'){if(d.restore&&y.dataset.v===d.v)return;y.dataset.v=d.v;
    if(!d.v){y.style.display='none';y.removeAttribute('src');return}
    y.style.display='block';y.src='https://www.youtube.com/embed/'+d.v+'?autoplay=1&enablejsapi=1&loop=1&'+(d.list?'list='+d.list:'playlist='+d.v)}
  else if(d.cmd==='music'){if(d.restore&&a.dataset.u===d.url)return;a.dataset.u=d.url;
    if(d.url){a.src=d.url;a.play().catch(()=>{})}else{a.pause();a.removeAttribute('src')}}
  else if(d.cmd==='mctl'){yc(YC[d.action]);if(d.action==='pause')a.pause();else if(d.action==='play'&&a.src)a.play().catch(()=>{})}
  else if(d.cmd==='vol'){a.volume=Math.min(1,Math.max(0,d.level/100));yc('setVolume',[d.level])}
  else if(d.cmd==='sayurl'){v.src=d.url;v.play().catch(()=>{})}
};
</script>
